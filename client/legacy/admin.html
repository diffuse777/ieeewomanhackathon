<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Hackathon · Admin</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    <header class="topbar">
      <div class="topbar-left">
        <a class="logo-btn" href="/home" aria-label="IEEE Women in Engineering KARE home">
          <img class="logo logo-wie" src="/images/wie-kare.jpg" alt="IEEE Women in Engineering KARE" />
        </a>
      </div>
      <div class="topbar-right">
        <img class="logo logo-kare" src="/images/kare.png" alt="Kalasalingam Academy of Research and Education" />
        <a class="btn btn-primary header-register" href="/register">Register</a>
      </div>
    </header>

    <main>
      <p class="kicker">Staff only</p>
      <h2>Admin</h2>
      <p class="lede">Sign in to review teams, payments, and exports. Admin APIs will be wired in a later phase.</p>
      <form class="admin-form" id="admin-form">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required placeholder="admin@example.com" />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required />
        </label>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p id="admin-message" class="muted">This page is live at /admin. Authentication is not connected yet.</p>
      </form>
    </main>
    <script src="/js/admin.js"></script>
  </body>
</html>
